; Textures en pleine resolution meme en qualite "Moyen" (sur une carte graphique integree, les textures
; coutent de la memoire partagee, pas de la puissance de calcul : 8 Go sont disponibles).
; Sans ca, le niveau 1 force MipBias=1 (textures en demi-resolution) et un pool de 600 Mo.
[TextureQuality@1]
r.Streaming.MipBias=0
r.Streaming.PoolSize=1500
r.Streaming.LimitPoolSizeToVRAM=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8

; La map est un couloir : pas de raison de couper la distance d'affichage a 60 %.
[ViewDistanceQuality@1]
r.ViewDistanceScale=1.0
