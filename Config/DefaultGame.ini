; --- Armes FPS (bras + arme + animations) : reglages sans recompiler ---
; RigOffset (cm, repere camera : X avant, Y droite, Z haut) decale tout le rig ; RigScale l'agrandit autour de l'oeil ;
; RigRotation (P,Y,R) le tourne ; AimOffset = decalage en visee (clic droit) pour aligner le viseur au centre ; MuzzleOffset = bouche du canon (flamme) ; TorchOffset = position de la lampe torche.
[Bodycam.Rig.Pistol]
