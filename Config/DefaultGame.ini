; --- Flash de bouche (taille x 100 cm). FlameAngle : tourner la flamme (0/90/180/270) si elle part dans le mauvais sens ---
[Bodycam.MuzzleFlash]
FrontSize=0.16
FlameLength=0.28
FlameWidth=0.09
FlameAngle=90
; Une traçante toutes les N balles (1 = toutes, 0 ou grand nombre = presque jamais)
TracerEvery=1

